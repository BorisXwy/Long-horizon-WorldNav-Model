project:
  name: nav_register_multidata_curriculum
  latent_cache: /sharedata/NAV/derived/latents
  initialization: /sharedata/Infinite-World/checkpoints/infinite_world_model.ckpt

common:
  train_scope: full
  optimizer: AdamW
  learning_rate: 1.0e-5
  weight_decay: 0.01
  precision: bfloat16
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  shuffle: true
  shuffle_seed: 20260727
  save_every: 500
  plateau:
    window: 200
    patience: 3
    min_relative_improvement: 0.01

stages:
  - name: short_context
    chunks: [2, 3]
    max_steps: 20000
    min_steps_before_plateau: 2000
    initialize_from: InfiniteWorld
  - name: medium_context
    chunks: [4, 7]
    max_steps: 15000
    min_steps_before_plateau: 2000
    initialize_from: previous_stage
  - name: long_context
    chunks: [8, null]
    max_steps: 10000
    min_steps_before_plateau: 1500
    initialize_from: previous_stage

variants:
  A: latent_prefix
  B: dit_condition
