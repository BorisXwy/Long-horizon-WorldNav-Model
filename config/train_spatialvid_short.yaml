project:
  name: nav_spatialvid_short_from_re10k1000
  dataset: SpatialVID
  latent_cache: /sharedata/NAV/derived/latents/spatialvid
  action_cache: /sharedata/NAV/derived/actions/spatialvid_short

initialization:
  A_latent_prefix: NAV/log/re10k-all-a-full-ebs4-from-infinite/full-final.pt
  B_dit_condition: NAV/log/re10k-all-b-full-ebs4-from-infinite/full-final.pt

sample:
  chunk_frames: 81
  min_chunks: 2
  max_chunks: 3
  window: deterministic_random_contiguous
  history: clean_teacher_forced_vae_latents
  target: last_chunk_only
  register: computed_online_in_forward
  local_memory: last_latent_frame_of_latest_history_chunk

training:
  train_scope: full
  optimizer: AdamW
  learning_rate: 1.0e-5
  weight_decay: 0.01
  precision: bfloat16
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  effective_batch_size: 4
  max_steps: 20000
  min_steps_before_plateau: 2000
  save_every: 500
  shuffle: true
  shuffle_seed: 20260728
  plateau:
    window: 200
    patience: 3
    min_relative_improvement: 0.01
