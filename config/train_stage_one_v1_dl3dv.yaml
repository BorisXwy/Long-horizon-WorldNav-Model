experiment:
  name: stage-one-v1-dl3dv
  status: confirmed
  dataset: DL3DV
  latent_cache: /sharedata/NAV/derived/latents/full_episodes_v1/dl3dv
  action_cache: /sharedata/NAV/derived/actions/full_episodes_v1/dl3dv
  manifest: /sharedata/NAV/derived/manifests/full_episodes_v1.jsonl

initialization:
  backbone: /sharedata/Infinite-World/checkpoints/infinite_world_model.ckpt
  resume_nav_checkpoint: null
  register_extractor_updater: random
  load_previous_a_or_b: false

model:
  variants:
    A: latent_prefix
    B: dit_condition
  register_initialization: extractor_from_first_history_chunk
  subsequent_history: updater
  local_memory: latest_history_chunk_last_latent_frame
  train_scope: full

sampling:
  history_chunks: [1, 2, 3]
  history_sampling: equal_shuffled_cycle
  target: next_chunk
  target_policy: last_target
  episode_shuffle: true
  random_window_start: true
  shuffle_seed: 20260730

optimization:
  steps: 10000
  optimizer: AdamW
  learning_rate: 1.0e-5
  weight_decay: 0.01
  precision: bfloat16
  gradient_checkpointing: true
  gradient_clip_norm: 1.0
  physical_batch_size_probe: 4
  concurrent_target_memory_fraction_per_variant: 0.5
  save_every: 1000
  plateau_stop: false

conditioning:
  text: empty_umt5
  action: dl3dv_dense_action
