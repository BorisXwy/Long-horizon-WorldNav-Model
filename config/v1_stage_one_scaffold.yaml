experiment:
  name: v1-stage1-scaffold
  status: scaffold_smoke_before_wan_dit_integration

data:
  hdf5_worker_root: /sharedata/NAV/derived/v1/vae_packs_hdf5_fullgpu14_7x7/workers
  samples: 194088
  shape:
    z_obs: [16, 1, 56, 112]
    z_future: [16, 1, 56, 112]
    action_primitive: [4]
  weighted_sampling:
    dl3dv: 0.35
    spatialvid: 0.40
    re10k: 0.15
    argoverse2: 0.10

model:
  note: V1.0 scaffold Transformer, not full Wan2.1/InfiniteWorld DiT.
  hidden_dim: 512
  num_layers: 4
  num_heads: 8
  register_tokens: 64
  action_horizon: 4
  patch_size: [1, 2, 2]
  token_count:
    register: 64
    obs: 1568
    future: 1568
    action: 4
    total: 3204

training:
  optimizer: AdamW
  lr: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  dtype: bf16
  loss:
    lambda_visual: 1.0
    lambda_action: 0.2
    visual: epsilon_prediction_mse
    action: primitive_cross_entropy
