# B 方案第二阶段：从 Register 预训练终点开始全参数微调。
base_config: train_register_re10k.yaml
model:
  variant: dit_condition
  register:
    latent_channels: 16
    register_dim: 256
    num_registers: 16
    num_update_layers: 2
    num_heads: 8
    caption_channels: 4096
train:
  train_scope: full
  freeze_backbone: false
  register_checkpoint: null
  learning_rate: 1.0e-5
  max_steps: 1000
  save_every: 100
  batch_size: 1
  gradient_accumulation_steps: 4
